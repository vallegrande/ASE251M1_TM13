<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
  <title>Contacto - Guardería Wawalu</title>
</head>
<body class="bg-gray-50">
  <div class="container mx-auto py-12 px-6">
    <h1 class="text-3xl font-bold text-blue-500 mb-6">Contacto</h1>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <div class="bg-white p-6 rounded-lg shadow">
        <h2 class="font-semibold mb-2">Información de Contacto</h2>
        <ul class="mb-4 space-y-2">
          <li class="flex items-center gap-2"><span class="material-icons text-blue-500">location_on</span>Av. Principal 123, Ciudad</li>
          <li class="flex items-center gap-2"><span class="material-icons text-blue-500">phone</span>+51 934 567 890</li>
          <li class="flex items-center gap-2"><span class="material-icons text-blue-500">email</span>info@ColegioWawalu.edu</li>
          <li class="flex items-center gap-2"><span class="material-icons text-blue-500">whatsapp</span>+51 934 567 890</li>
          <li class="flex items-center gap-2"><span class="material-icons text-blue-500">schedule</span>8:00 AM hasta las 6:00 PM</li>
        </ul>
        <div class="flex gap-3">
          <a href="#" class="text-pink-500"><span class="material-icons text-2xl">tag</span></a>
          <a href="#" class="text-blue-500"><span class="material-icons text-2xl">facebook</span></a>
          <a href="#" class="text-black"><span class="material-icons text-2xl">tiktok</span></a>
        </div>
      </div>
      <div class="bg-white p-6 rounded-lg shadow">
        <h2 class="font-semibold mb-2">Formulario de Contacto</h2>
        <form class="space-y-4">
          <div>
            <label class="block mb-1 font-medium">Nombre :</label>
            <input type="text" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Tu nombre">
          </div>
          <div>
            <label class="block mb-1 font-medium">Email :</label>
            <input type="email" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="ejemplo@email.com">
          </div>
          <div>
            <label class="block mb-1 font-medium">Mensaje :</label>
            <textarea class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" rows="4" placeholder="Escribe tu mensaje..."></textarea>
          </div>
          <button type="submit" class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600 font-semibold">Enviar Mensaje</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
