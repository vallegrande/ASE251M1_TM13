{# Componente de formulario de usuario reutilizable #}
<form id="userForm" method="post" class="space-y-4">
    <div>
        <label for="name" class="block text-sm font-medium text-gray-700">Nombre</label>
        <input type="text" name="name" id="name" value="{{ user.name if user else '' }}" required class="mt-1 px-4 py-2 border rounded-lg w-full">
    </div>
    <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" name="email" id="email" value="{{ user.email if user else '' }}" required class="mt-1 px-4 py-2 border rounded-lg w-full">
    </div>
    <div>
        <label for="role" class="block text-sm font-medium text-gray-700">Rol</label>
        <select name="role" id="role" class="mt-1 px-4 py-2 border rounded-lg w-full">
            <option value="padre" {% if user and user.role == 'padre' %}selected{% endif %}>Padre</option>
            <option value="madre" {% if user and user.role == 'madre' %}selected{% endif %}>Madre</option>
            <option value="tutor" {% if user and user.role == 'tutor' %}selected{% endif %}>Tutor</option>
            <option value="staff" {% if user and user.role == 'staff' %}selected{% endif %}>Staff</option>
        </select>
    </div>
    <div>
        <label for="is_admin" class="inline-flex items-center">
            <input type="checkbox" name="is_admin" id="is_admin" value="1" {% if user and user.is_admin %}checked{% endif %} class="form-checkbox">
            <span class="ml-2 text-sm text-gray-700">Administrador</span>
        </label>
    </div>
    <div>
        <label for="is_active" class="inline-flex items-center">
            <input type="checkbox" name="is_active" id="is_active" value="1" {% if user and user.is_active %}checked{% endif %} class="form-checkbox">
            <span class="ml-2 text-sm text-gray-700">Activo</span>
        </label>
    </div>
    <div class="flex justify-end gap-2">
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 flex items-center">
            <span class="material-icons mr-2">save</span> Guardar
        </button>
        <button type="button" class="bg-gray-200 text-gray-700 px-4 py-2 rounded hover:bg-gray-300 flex items-center" onclick="closeUserModal()">
            <span class="material-icons mr-2">close</span> Cancelar
        </button>
    </div>
</form>
