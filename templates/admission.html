<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
  <title>Formulario de Admisión</title>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-xl mx-auto mt-10">
    <h2 class="text-3xl font-bold text-blue-500 mb-8 text-center tracking-wide">Formulario de Admisión</h2>
    {% if error %}
      <div class="bg-red-100 text-red-700 px-4 py-2 rounded mb-4 text-center">{{ error }}</div>
    {% endif %}
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="bg-green-100 text-green-700 px-4 py-2 rounded mb-4 text-center">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
  <form class="space-y-6" method="post" novalidate>
      <div>
        <label class="block mb-2 font-semibold text-gray-700">Nombre del niño</label>
        <input type="text" name="nombre_nino" required class="w-full bg-blue-50 border border-blue-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 transition placeholder-gray-400" placeholder="Nombre del niño">
      </div>
      <div>
        <label class="block mb-2 font-semibold text-gray-700">Edad</label>
        <input type="number" name="edad" required min="1" max="6" class="w-full bg-blue-50 border border-blue-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 transition placeholder-gray-400" placeholder="Edad">
      </div>
      <div>
        <label class="block mb-2 font-semibold text-gray-700">Nombre del padre/madre</label>
        <input type="text" name="nombre_padre" required class="w-full bg-blue-50 border border-blue-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 transition placeholder-gray-400" placeholder="Nombre del padre/madre">
      </div>
      <div>
        <label class="block mb-2 font-semibold text-gray-700">Teléfono</label>
        <input type="tel" name="telefono" required pattern="[0-9]{9,}" class="w-full bg-blue-50 border border-blue-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 transition placeholder-gray-400" placeholder="Teléfono">
      </div>
      <div>
        <label class="block mb-2 font-semibold text-gray-700">Email</label>
        <input type="email" name="email" required class="w-full bg-blue-50 border border-blue-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 transition placeholder-gray-400" placeholder="Email">
      </div>
  <button type="submit" class="bg-blue-500 text-white px-8 py-2 rounded-lg hover:bg-blue-600 font-semibold shadow transition w-full">Enviar Solicitud</button>
    </form>
  </div>
</body>
</html>
